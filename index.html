<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System Pro</title>
    <style>
        @import 'tailwindcss/base';
        @import 'tailwindcss/components';
        @import 'tailwindcss/utilities';

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            @apply bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-50 transition-colors duration-300;
        }

        .glass {
            @apply bg-white dark:bg-gray-800 backdrop-blur-lg bg-opacity-80 dark:bg-opacity-80;
        }

        .card {
            @apply bg-white dark:bg-gray-800 rounded-xl shadow-sm dark:shadow-lg border border-gray-100 dark:border-gray-700;
        }

        .btn {
            @apply px-4 py-2 rounded-lg font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 dark:focus:ring-offset-gray-900;
        }

        .btn-primary {
            @apply bg-blue-500 hover:bg-blue-600 text-white shadow-md hover:shadow-lg;
        }

        .btn-secondary {
            @apply bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-900 dark:text-gray-50;
        }

        .badge {
            @apply inline-block px-3 py-1 rounded-full text-sm font-medium;
        }

        .badge-pass {
            @apply bg-green-100 dark:bg-green-900 text-green-800 dark:text-green-200;
        }

        .badge-fail {
            @apply bg-red-100 dark:bg-red-900 text-red-800 dark:text-red-200;
        }

        .badge-grade {
            @apply text-white font-bold;
        }

        .badge-a {
            @apply bg-green-500;
        }

        .badge-b {
            @apply bg-blue-500;
        }

        .badge-c {
            @apply bg-yellow-500;
        }

        .badge-d {
            @apply bg-orange-500;
        }

        .badge-f {
            @apply bg-red-500;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .skeleton {
            @apply animate-pulse bg-gray-200 dark:bg-gray-700 rounded;
        }

        .input-field {
            @apply w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400 transition-all;
        }

        .select-field {
            @apply w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400;
        }

        .table-container {
            @apply overflow-x-auto;
        }

        .table-row {
            @apply border-b border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors;
        }

        .table-cell {
            @apply px-4 py-3 text-sm;
        }

        .toast {
            @apply fixed bottom-4 right-4 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-50 px-6 py-4 rounded-lg shadow-lg border border-gray-200 dark:border-gray-700 animate-pulse z-50;
        }

        .toast-success {
            @apply border-l-4 border-green-500;
        }

        .toast-error {
            @apply border-l-4 border-red-500;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
